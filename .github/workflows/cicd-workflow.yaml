name: NodeJs App Deploy CI/CD 

on:
  push:
    branches: [dev-automation]

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: nisal98/nodejs-book-app:latest
  deploy: 
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull Docker Image
        run: docker pull nisal98/nodejs-book-app:latest

      - name: Delete Old Container
        run: docker rm -f nodejs-book-app-container 

      - name: Run Docker Container
        run: docker run -d -p 5000:5000 -name nodejs-book-app-container nisal98/nodejs-book-app